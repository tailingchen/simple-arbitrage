[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
script = "script"
solc = "0.8.29"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
sepolia = "${RPC_URL}"
mainnet = "${RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
mainnet = { key = "${ETHERSCAN_API_KEY}" }